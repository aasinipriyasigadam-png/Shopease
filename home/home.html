<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    {% load static %}
    <link rel="stylesheet" href="{% static 'home.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form class="items-container">
        <div class="items-header">
            <div class="heading">COSMETICS</div>
            <div class="forms">
                {% if not request.user.is_authenticated %}
                <a href="http://127.0.0.1:8000/register" class="log">Register Now</a>
                <a href="http://127.0.0.1:8000/login" class="log">Login</a>
                {% else %}
                <div class="username">
                    <img src="{% static 'images/icon.svg' %}" class="icon" alt="">
                    <div>Welcome, {{request.user.username}}</div>
                </div>
                <a href="http://127.0.0.1:8000/logout" class="log">Logout</a>
                {% endif %}
                <a href="http://127.0.0.1:8000/home" class="log">Home</a>
                <a href="http://127.0.0.1:8000/cart" class="log">Cart</a>
                <a href="http://127.0.0.1:8000/orders" class="log">Orders</a>
            </div>
        </div>
        <div id="items">
            {% for item in items%}
            <div class="card">
                <img src="{{ item.image }}" class="picture" alt="">
                <div class="name">{{item.name}}</div>
                <div class="des">{{item.description}}</div>
                <div class="price">
                    ₹ {{item.price}} /-
                </div>
                <div class="buy">
                    <div class="button1" onclick="add_to_cart('{{item.id}}')">Cart</div>
                    <div class="button2" onclick="ordered_items('{{item.id}}')">Buy Now</div>
                </div>
            </div>
            {%endfor%}
        </div>
    </form>
</body>
<script src="{%static 'JS/cart.js' %}"></script>
<script src="{%static 'JS/order.js' %}"></script>
</html>
